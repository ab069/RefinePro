services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refinepro
      POSTGRES_USER: refinepro
      POSTGRES_PASSWORD: refinepro_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refinepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://refinepro:refinepro_secret@postgres:5432/refinepro

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
